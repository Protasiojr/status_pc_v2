services:
  status-pc:
    build: .
    image: status-pc-v2:latest
    container_name: status-pc-v2
    restart: unless-stopped
    network_mode: host
    env_file:
      - .env
    environment:
      PORT: "6001"
      SSH_KNOWN_HOSTS_PATH: /app/data/ssh/known_hosts
    volumes:
      - ./data:/app/data
